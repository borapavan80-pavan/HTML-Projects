<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<style>
    body {
        justify-content: center;
        align-items: center;
        background-color: yellow;
    }
</style>
<body>

    <h1>Student Registration Form</h1>
    <h2>Registration open</h2>
    <hr>
    <h1>Basic Details</h1>
    <from>
        <label>Student ID:</label>
        <input type="text" placeholder="Enter your student ID"><br><br>
        <label>First Name:</label>
        <input type="text" placeholder="Enter your first name"><br><br>
        <label>Last Name:</label>
        <input type="text" placeholder="Enter your last name"><br><br>
        <label>Father's Name:</label>
        <input type="text" placeholder="Enter your father's name"><br><br>
        <label>Mother's Name:</label>
        <input type="text" placeholder="Enter your mother's name"><br><br>

    </from>

    <form>
        <label>Mobile Number:</label><br>
        <input type="text" placeholder="Enter your mobile number"><br><br>

        <label>Email:</label><br>
        <input type="text" placeholder="Enter your email"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter your password"><br><br>

        <label>Address:</label><br>
        <input type="tel" placeholder="Enter your address"><br><br>
        <label>City:</label>
        <input type="text" placeholder="Enter your city"><br><br>
        <label>State:</label>
        <input type="text" placeholder="Enter your state"><br><br>
        <label>Country:</label>
        <input type="text" placeholder="Enter your country"><br><br>
        <label>Pin Code:</label>
        <input type="text" placeholder="Enter your pin code"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Course:</label><br>
        <select>
            <option>Select Course</option>
            <option>Python</option>
            <option>Java</option>
            <option>HTML & CSS</option>
            <option>JavaScript</option>
            <option>React</option>
            <option>C Programming</option>
            <option>Web Development</option>
        </select>
        <br><br>

        <label>Skills:</label><br>
        <input type="checkbox"> HTML<br>
        <input type="checkbox"> CSS<br>
        <input type="checkbox"> JavaScript<br>
        <input type="checkbox"> Python<br><br>

        <label>Address:</label><br>
        <textarea rows="5" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <label>Upload Photo:</label><br>
        <input type="file"><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
        <button type="submit">Submit</button>

    </form>

    <hr>
    <footer>
        <p>&copy; 2026 Student Registration Form</p>
    </footer>

</body>
</html>
