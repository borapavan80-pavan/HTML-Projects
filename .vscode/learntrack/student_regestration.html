<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NRIIT Student Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background-color: #f2f4f7;
        }

        /* Main Form Box */

        .container {
            width: 600px;
            max-width: 100%;

            margin: auto;

            background-color: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        /* Heading */

        h1 {
            text-align: center;
            color: blue;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: green;
        }

        hr {
            margin: 20px 0;
        }

        /* Section Heading */

        .section-title {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* Labels */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;

            font-weight: bold;
        }

        /* Input Fields */

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;

            padding: 10px;

            border: 1px solid #aaa;

            border-radius: 5px;

            font-size: 15px;
        }

        /* Radio Buttons */

        .gender {
            margin-top: 10px;
        }

        .gender label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        /* Skills */

        .skills {
            margin-top: 10px;
        }

        .skills label {
            font-weight: normal;
            margin: 8px 0;
        }

        /* Buttons */

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .buttons input,
        .buttons button {
            padding: 12px 25px;

            border: none;

            border-radius: 6px;

            margin: 5px;

            cursor: pointer;

            font-size: 15px;
        }

        .register {
            background-color: green;
            color: white;
        }

        .reset {
            background-color: red;
            color: white;
        }

        .submit {
            background-color: blue;
            color: white;
        }

        /* Footer */

        footer {
            text-align: center;

            margin-top: 20px;

            color: #555;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>NRIIT Student Registration Form</h1>

        <h2>Registration Open</h2>

        <hr>

        <h2 class="section-title">Basic Details</h2>


        <form>

            <label>Student ID:</label>

            <input type="text"
                   placeholder="Enter your student ID">


            <label>First Name:</label>

            <input type="text"
                   placeholder="Enter your first name">


            <label>Last Name:</label>

            <input type="text"
                   placeholder="Enter your last name">


            <label>Father's Name:</label>

            <input type="text"
                   placeholder="Enter your father's name">


            <label>Mother's Name:</label>

            <input type="text"
                   placeholder="Enter your mother's name">


            <label>Mobile Number:</label>

            <input type="tel"
                   placeholder="Enter your mobile number">


            <label>Email:</label>

            <input type="email"
                   placeholder="Enter your email">


            <label>Password:</label>

            <input type="password"
                   placeholder="Enter your password">


            <label>Address:</label>

            <textarea rows="4"
                      placeholder="Enter your address"></textarea>


            <label>City:</label>

            <input type="text"
                   placeholder="Enter your city">


            <label>State:</label>

            <input type="text"
                   placeholder="Enter your state">


            <label>Country:</label>

            <input type="text"
                   placeholder="Enter your country">


            <label>Pin Code:</label>

            <input type="text"
                   placeholder="Enter your pin code">


            <label>Date of Birth:</label>

            <input type="date">


            <label>Gender:</label>

            <div class="gender">

                <label>
                    <input type="radio" name="gender">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender">
                    Other
                </label>

            </div>


            <label>Course:</label>

            <select>

                <option>Select Course</option>

                <option>Computer Science</option>

                <option>Data Science</option>

                <option>Artificial Intelligence</option>

                <option>Cyber Security</option>

                <option>Information Technology</option>

            </select>


            <label>Skills:</label>

            <div class="skills">

                <label>
                    <input type="checkbox">
                    HTML
                </label>

                <label>
                    <input type="checkbox">
                    CSS
                </label>

                <label>
                    <input type="checkbox">
                    JavaScript
                </label>

                <label>
                    <input type="checkbox">
                    Python
                </label>

            </div>


            <label>Upload Photo:</label>

            <input type="file">


            <div class="buttons">

                <input type="submit"
                       value="Register"
                       class="register">

                <input type="reset"
                       value="Reset"
                       class="reset">

                <button type="submit"
                        class="submit">
                    Submit
                </button>

            </div>

        </form>

    </div>


    <footer>

        <p>
            © 2026 Student Registration Form
        </p>

    </footer>

</body>

</html>
